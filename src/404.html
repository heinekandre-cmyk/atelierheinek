<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Seite nicht gefunden — Atelier Heinek</title>
<meta name="theme-color" content="#131211" />
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20fill='%23131211'/%3E%3Ctext%20x='32'%20y='43'%20font-family='Georgia,serif'%20font-style='italic'%20font-size='30'%20fill='%23ece2cc'%20text-anchor='middle'%3EAH%3C/text%3E%3C/svg%3E" />
<link href="/vendor/fonts/fonts.css" rel="stylesheet" />
<style>
  /* ── Schwarzer Sand · 404 ─────────────────────────────────────────────
     Erbt die Welt der Eintrittsseite. Die Botschaft passt zum Handwerk:
     Beim Sandguss wird jede Form nach dem Guss zerstört — diese hier
     hat es schlicht nie gegeben. */
  :root {
    --bg: #131211;
    --ink: #edebe4;
    --ink-muted: #a09b8e;
    --ink-faint: #8a8476;
    --line: #3c3933;
    --sand: #c8b896;
    --ember: #e0772b;
    --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: 'Archivo', sans-serif;
    display: flex; flex-direction: column;
    min-height: 100dvh; position: relative;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none;
    background-image:
      radial-gradient(circle at 30% 40%, rgba(200, 184, 150, 0.06) 0%, transparent 50%),
      radial-gradient(circle at 70% 60%, rgba(168, 146, 114, 0.04) 0%, transparent 60%),
      radial-gradient(circle at 1px 1px, rgba(200, 184, 150, 0.12) 1px, transparent 0);
    background-size: auto, auto, 4px 4px;
    opacity: 0.7;
  }
  main {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 48px 24px;
    position: relative;
  }
  .code {
    font-family: 'Playfair Display', serif; font-style: italic; font-weight: 500;
    font-size: clamp(64px, 14vw, 110px); line-height: 1;
    color: #e8dec8; letter-spacing: -0.01em;
  }
  h1 {
    font-family: 'Playfair Display', serif; font-weight: 500;
    font-size: clamp(12px, 2.4vw, 14px); letter-spacing: 0.45em;
    text-transform: uppercase; color: #b8a888;
    margin-top: 26px; padding-left: 0.45em;
  }
  .note {
    font-family: 'Playfair Display', serif; font-style: italic;
    font-size: clamp(15px, 3vw, 18px); color: var(--ink-muted);
    letter-spacing: 0.03em; margin-top: 24px; max-width: 34em; line-height: 1.6;
  }
  .actions { margin-top: 40px; display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
  .actions a {
    display: inline-block; text-decoration: none;
    font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--sand); border: 1px solid var(--line);
    padding: 15px 26px; transition: all var(--transition);
  }
  .actions a.primary { border-color: rgba(224, 119, 43, 0.45); }
  .actions a:hover { color: var(--ink); border-color: var(--ember); }
  .actions a:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }
  footer {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px 22px;
    padding: 22px 24px calc(22px + env(safe-area-inset-bottom));
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink-faint);
  }
  footer a { color: var(--ink-faint); text-decoration: none; transition: color var(--transition); }
  footer a:hover, footer a:focus-visible { color: var(--sand); }
  footer .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--line); }
</style>
</head>
<body>

<main>
  <div class="code" aria-hidden="true">404</div>
  <h1>Diese Form gibt es nicht</h1>
  <p class="note">Beim Sandguss wird jede Form nach dem Guss zerstört — diese
  Seite hat es allerdings nie gegeben. Vielleicht ein Tippfehler in der
  Adresse, vielleicht ein alter Link.</p>
  <div class="actions">
    <a class="primary" href="/werkbank/">Zur Werkbank</a>
    <a href="/">Zur Startseite</a>
  </div>
</main>

<footer>
  <a href="/faq.html">Fragen</a>
  <span class="sep" aria-hidden="true"></span>
  <a href="/impressum.html">Impressum</a>
  <span class="sep" aria-hidden="true"></span>
  <a href="mailto:info@atelierheinek.com">info@atelierheinek.com</a>
</footer>

</body>
</html>
